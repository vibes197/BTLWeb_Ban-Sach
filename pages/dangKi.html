<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="../assets/fonts/themify-icons/themify-icons.css">
    <link rel="stylesheet" href="../assets/css/dangnhap.css">
</head>

<body>
    <div class="container">
        <div class="form-box">
            <h2>Đăng ký</h2>

            <div class="input-box">
                <input type="email" id="regEmail" required placeholder=" ">
                <label>Email</label>
            </div>

            <div class="input-box">
                <input type="password" id="regPassword" required placeholder=" ">
                <label>Mật khẩu</label>
            </div>

            <div class="input-box">
                <input type="text" id="regName" required placeholder=" ">
                <label>Tên</label>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="agree">
                <label>Tôi đồng ý điều khoản</label>
            </div>

            <button onclick="register()">Đăng ký</button>

            <p>Đã có tài khoản?
                <a href="./dangNhap.html">Đăng nhập ngay</a>
            </p>
            <a href="../index.html" class="back-home">&larr; Về trang chủ</a>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>

</html>
