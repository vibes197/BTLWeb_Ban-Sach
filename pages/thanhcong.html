<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Thành Công - AyaBook</title>
    <link rel="stylesheet" href="../assets/src/css/trangchu.css">
    <link rel="stylesheet" href="../assets/fonts/themify-icons/themify-icons.css">
    <style>
        body {
            background-color: #B5DCE8;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #success-main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 80px);
            padding: 20px;
        }

        .success-box {
            background-color: #D6D6D6;
            padding: 40px 50px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: #333;
        }

        .success-box h2 {
            text-align: center;
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .success-row {
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.5;
        }

        div.success-row-flex {
            display: flex;
            justify-content: space-between;
            max-width: 350px;
            margin-bottom: 25px;
            font-size: 16px;
        }

        .total-price {
            color: #ee4d2d;
            font-weight: normal;
        }

        .success-link {
            color: #00bfff;
            text-decoration: underline;
        }

        .success-divider {
            height: 1px;
            background-color: #999;
            margin: 30px 0;
        }

        .hotline {
            color: #00bfff;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="header" style="background: transparent;">
            <ul id="nav" style="background: transparent;">
                <a href="../index.html"><img class="logo" src="./assets/img/trangchu/AyaBook.png" alt="AyaBook Logo"></a>
                <li><a href="../index.html">Trang chủ</a></li>
                <li>
                    <a href="faq.html">
                        FAQ &amp; Hỏi đáp
                    </a>
                </li>
                <li><a href="vechungtoi.html">Về chúng tôi</a></li>
                <li><a href="#footer">Liên hệ với chúng tôi</a></li>
                <li class="push-right"><a href="yeuthich.html"><img class="shop" src="./assets/img/trangchu/Fav.png"
                            alt="Yêu thích"></a></li>
                <li><a href="donhang.html"><img class="fav" src="./assets/img/trangchu/VectorShop .png"
                            alt="Giỏ hàng"></a></li>
                <button><a href="#footer">Liên hệ</a></button>
                <li><a id="loginBtn" href="./dangNhap.html">Đăng Nhập</a></li>
            </ul>
        </div>
        <hr style="opacity: 0.3;">

        <div id="success-main">
            <div class="success-box">
                <h2>ĐẶT HÀNG THÀNH CÔNG</h2>

                <div class="success-row" style="margin-bottom: 30px;">
                    Cảm ơn bạn đã đặt hàng tại Aya Book
                </div>

                <div class="success-row-flex">
                    <span>Tổng tiền thanh toán:</span>
                    <span class="total-price" id="success-total">0đ</span>
                </div>

                <div class="success-row" style="margin-bottom: 15px;">
                    <span>Mã đơn: <span id="success-code"></span></span>
                </div>

                <div class="success-row">
                    Để xem lịch sử mua hàng vui lòng <a href="#" class="success-link">Xem tại đây</a>
                </div>

                <div class="success-divider"></div>

                <div class="success-row" style="margin-bottom: 0;">
                    Để được hỗ trợ vui lòng gọi vào hotline <a href="tel:19001348" class="hotline">1900 1348</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/src/js/main.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const total = urlParams.get('total') || '0đ';

        document.getElementById('success-total').textContent = total;

        const randomCode = Math.floor(1000000 + Math.random() * 9000000);
        document.getElementById('success-code').textContent = randomCode;
    </script>
</body>

</html>
