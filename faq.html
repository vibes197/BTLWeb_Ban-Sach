<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ & Hỏi đáp - Tư vấn khách hàng - AyaBook</title>
    <link rel="stylesheet" href="./assets/css/trangchu.css">
    <link rel="stylesheet" href="./assets/fonts/themify-icons/themify-icons.css">
    <style>
        body {
            background-color: #B5DCE8;
            /* Màu nền xanh nhạt */
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        #faq-main {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .faq-box {
            background-color: #DCDCDC;
            /* Hộp màu xám sáng giống hình */
            padding: 50px 80px;
            width: 100%;
            max-width: 700px;
            box-sizing: border-box;
            color: #333;
        }

        .faq-box h2 {
            text-align: center;
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 40px;
            color: #222;
        }

        .faq-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .faq-form input,
        .faq-form textarea {
            width: 100%;
            padding: 20px 25px;
            border: none;
            border-radius: 15px;
            /* Bo góc mượt giống hình */
            font-size: 18px;
            box-sizing: border-box;
            background-color: #fff;
            outline: none;
            color: #333;
        }

        .faq-form input::placeholder,
        .faq-form textarea::placeholder {
            color: #111;
        }

        .faq-form textarea {
            resize: none;
            min-height: 180px;
        }

        .faq-buttons {
            display: flex;
            justify-content: center;
            gap: 80px;
            /* Khoảng cách giữa 2 nút */
            margin-top: 20px;
        }

        .faq-buttons button {
            background-color: #B5DCE8;
            border: none;
            padding: 12px 0;
            width: 130px;
            border-radius: 25px;
            font-size: 18px;
            color: #111;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .faq-buttons button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="container">
        <!-- HEADER SAO CHÉP TỪ CÁC TRANG KHÁC -->
        <div id="header" style="background: transparent;">
            <ul id="nav" style="background: transparent;">
                <a href="index.html"><img class="logo" src="./assets/img/trangchu/AyaBook.png" alt="AyaBook Logo"></a>
                <li><a href="index.html">Trang chủ</a></li>
                <li>
                    <a href="faq.html">
                        FAQ &amp; Hỏi đáp
                        <i class="ti-angle-down"></i>
                    </a>
                </li>
                <li><a href="#">Về chúng tôi</a></li>
                <li><a href="#footer">Liên hệ với chúng tôi</a></li>
                <li class="push-right"><a href="yeuthich.html"><img class="shop" src="./assets/img/trangchu/Fav.png"
                            alt="Yêu thích"></a></li>
                <li><a href="donhang.html"><img class="fav" src="./assets/img/trangchu/VectorShop .png"
                            alt="Giỏ hàng"></a></li>
                <button><a href="#footer">Liên hệ</a></button>
                <li><a id="loginBtn" href="./dangNhap.html">Đăng Nhập</a></li>
            </ul>
        </div>
        <hr style="opacity: 0.3;">

        <div id="faq-main">
            <div class="faq-box">
                <h2>Tư vấn khách hàng</h2>

                <form class="faq-form" onsubmit="handleSubmit(event)">
                    <input type="text" id="faq-name" placeholder="Họ và tên:" required>
                    <input type="tel" id="faq-phone" placeholder="SĐT:" required>
                    <textarea id="faq-content" placeholder="Nội dung:" required></textarea>

                    <div class="faq-buttons">
                        <button type="button" onclick="window.history.back()">Quay lại</button>
                        <button type="submit">Gửi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./js/script.js"></script>
    <script>
        function handleSubmit(event) {
            event.preventDefault(); // Ngăn chặn tải lại trang

            // Có thể lấy dữ liệu form ở đây nếu cần gửi lên server
            const name = document.getElementById('faq-name').value;

            alert('Cảm ơn ' + name + '! Chúng tôi đã nhận được thông tin và sẽ gọi tư vấn cho bạn sớm nhất.');

            // Xóa nội dung form để người dùng có thể nhập tiếp nếu ở lại, 
            // hoặc chuyển hướng về trang chủ:
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
